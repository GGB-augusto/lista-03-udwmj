<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista 03 Exercício 03</title>
  <link rel="stylesheet" href="pratica03e03.css">
</head>

<body>

  <main>

    <h1 id="titulo">Programa de operações matemáticas</h1>

    <script>
      var num1 = parseInt(prompt("Digite o primeiro número"));
      var num2 = parseInt(prompt("Digite o segundo número"));

      if (num1 + num2){
        document.write("<h2 id='soma'>A soma dos números é: " + (num1 + num2) + "</h2>");
      } if (num1 - num2){
        document.write("<h2 id='subtração'>A subtração dos números é: " + (num1 - num2) + "</h2>");
      } if (num1 * num2){
        document.write("<h2 id='multiplicação'>A multiplicação dos números é: " + (num1 * num2) + "</h2>");
      } if (num1 / num2){
        document.write("<h2 id='divisão'>A divisão dos números é: " + (num1 / num2) + "</h2>");
      } if (num1 % num2){
        document.write("<h2 id='resto'>O resto da divisão dos números é: " + (num1 % num2) + "</h2>");
      }

      document.write("<h1>Número 1: " + num1 + "</h1>");
      document.write("<h1>Número 2: " + num2 + "</h1>");
      

    </script>


  </main>

</body>

</html>
